version: '3.8'

services:
  blood-donation-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blood-donation-api
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - blood-donation-network

  blood-donation-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: blood-donation-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app/src
      - API_URL=http://blood-donation-api:8001
    restart: unless-stopped
    volumes:
      - ./tmp:/app/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      blood-donation-api:
        condition: service_healthy
    networks:
      - blood-donation-network

networks:
  blood-donation-network:
    driver: bridge